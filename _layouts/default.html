<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }} — Vibely</title>
<meta name="description" content="{{ page.description | default: 'Legal documents for the Vibely mobile app.' }}">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📍</text></svg>">
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1a1f;
    --muted: #5c5c68;
    --rule: #e3e3ea;
    --accent: #d8365f;
    --code-bg: #f4f4f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f0f16;
      --fg: #e8e8ef;
      --muted: #9a9aa8;
      --rule: #26262f;
      --accent: #ff7a9c;
      --code-bg: #1a1a24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; }
  header.site {
    border-bottom: 1px solid var(--rule);
    margin-bottom: 2.5rem;
    padding-bottom: 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 0.5rem 1.25rem;
    align-items: baseline;
  }
  header.site a.brand {
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--fg);
    text-decoration: none;
    letter-spacing: -0.01em;
  }
  header.site nav { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.9rem; }
  header.site nav a { color: var(--muted); text-decoration: none; }
  header.site nav a:hover, header.site nav a[aria-current] { color: var(--accent); }
  h1 { font-size: 1.9rem; line-height: 1.25; letter-spacing: -0.02em; margin: 0 0 1.25rem; }
  h2 { font-size: 1.3rem; margin: 2.5rem 0 0.75rem; letter-spacing: -0.01em; }
  h3 { font-size: 1.05rem; margin: 1.75rem 0 0.5rem; }
  p, li { overflow-wrap: break-word; }
  a { color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 2.5rem 0; }
  strong { font-weight: 650; }
  code {
    background: var(--code-bg);
    padding: 0.15em 0.4em;
    border-radius: 4px;
    font-size: 0.9em;
  }
  blockquote {
    margin: 1.25rem 0;
    padding: 0.25rem 0 0.25rem 1rem;
    border-left: 3px solid var(--rule);
    color: var(--muted);
  }
  /* Wide tables scroll inside their own box so the page never scrolls sideways. */
  .table-scroll { overflow-x: auto; margin: 1.25rem 0; }
  table { border-collapse: collapse; width: 100%; font-size: 0.94rem; }
  th, td { text-align: left; padding: 0.55rem 0.8rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
  th { font-weight: 650; white-space: nowrap; }
  footer.site {
    margin-top: 4rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer.site a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="site">
    <a class="brand" href="{{ '/' | relative_url }}">Vibely</a>
    <nav>
      <a href="{{ '/privacy-policy/' | relative_url }}">Privacy Policy</a>
      <a href="{{ '/terms-of-service/' | relative_url }}">Terms of Service</a>
      <a href="{{ '/account-deletion/' | relative_url }}">Delete Account</a>
      <a href="{{ '/support/' | relative_url }}">Support</a>
    </nav>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site">
    <p>Vibely is operated by Aryan Mehta, New Delhi, India.
    Contact <a href="mailto:spacevibely@gmail.com">spacevibely@gmail.com</a>.</p>
  </footer>
</div>
<script>
  // Markdown tables are emitted bare; wrap each so it scrolls independently
  // rather than forcing the whole page to scroll horizontally on a phone.
  document.querySelectorAll('main table').forEach(function (t) {
    var box = document.createElement('div');
    box.className = 'table-scroll';
    t.parentNode.insertBefore(box, t);
    box.appendChild(t);
  });
</script>
</body>
</html>
